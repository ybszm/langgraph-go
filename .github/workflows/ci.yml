name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./... -count=1
      - run: go test -race ./... -count=1
      - run: go vet ./...

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: langgraph
          POSTGRES_PASSWORD: langgraph
          POSTGRES_DB: langgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U langgraph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Create isolated integration databases
        shell: bash
        run: |
          container="$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}' | head -n 1)"
          test -n "$container"
          for database in distributed cache checkpoint store vector; do
            docker exec "$container" createdb -U langgraph "$database"
          done
      - name: Distributed PostgreSQL
        env:
          LANGGRAPH_POSTGRES_DSN: postgres://langgraph:langgraph@127.0.0.1:5432/distributed?sslmode=disable
        run: go test ./backend/distributed -run '^TestPostgres' -count=1
      - name: PostgreSQL cache
        env:
          LANGGRAPH_POSTGRES_DSN: postgres://langgraph:langgraph@127.0.0.1:5432/cache?sslmode=disable
        run: go test ./cache/postgres -count=1
      - name: Native PostgreSQL checkpoint saver
        env:
          LANGGRAPH_POSTGRES_DSN: postgres://langgraph:langgraph@127.0.0.1:5432/checkpoint?sslmode=disable
        run: go test ./checkpoint/postgres -run '^(TestSaverContract|TestPutTransactionRollsBackBlobs|TestConcurrentSaverInstancesAndCancellation)$' -count=1
      - name: Native PostgreSQL store
        env:
          LANGGRAPH_POSTGRES_DSN: postgres://langgraph:langgraph@127.0.0.1:5432/store?sslmode=disable
        run: go test ./store/postgres -run '^(TestPostgresTTL.*|TestPostgresSchema.*|TestStoreContract|TestBatchRollsBackAllWrites|TestConcurrentStoreInstances|TestSearchPushdownPreservesFilterSemantics)$' -count=1
      - name: PostgreSQL vector index
        env:
          LANGGRAPH_POSTGRES_DSN: postgres://langgraph:langgraph@127.0.0.1:5432/vector?sslmode=disable
        run: go test ./store/vector/sql -run '^TestPostgres' -count=1

  temporal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Start Temporal development server
        run: docker run -d --name temporal -p 7233:7233 temporalio/temporal@sha256:2c344b4a39b4489fc6944db095f628f0c30659836faf11780a4dc435599e80e3 server start-dev --ip 0.0.0.0 --log-level warn
      - name: Wait for Temporal and run integration
        env:
          LANGGRAPH_TEMPORAL_ADDRESS: 127.0.0.1:7233
        run: |
          for attempt in {1..30}; do
            if go test ./backend/temporal/sdk -run TestTemporalServerIntegration -count=1; then
              exit 0
            fi
            sleep 2
          done
          docker logs temporal
          exit 1
